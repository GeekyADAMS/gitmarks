name: Feature request
description: Suggest a change. Start with the problem, not the solution.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This fits a single-person, no-database tool (see CONTRIBUTING.md → Scope)
          required: true
