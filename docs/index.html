<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>gitmarks — private, categorised bookmarks in your own GitHub repo</title>
    <meta
      name="description"
      content="Save from the web, a browser extension, X, and the iPhone and Android share sheets. Every save is a commit to a repo you own."
    />
    <meta property="og:title" content="gitmarks" />
    <meta property="og:description" content="Private, categorised bookmarks in your own GitHub repo." />
    <meta property="og:image" content="https://geekyadams.github.io/gitmarks/video/poster.jpg" />
    <meta property="og:video" content="https://geekyadams.github.io/gitmarks/video/gitmarks-intro.mp4" />
    <meta name="theme-color" content="#0d0d0e" />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        padding: 32px 20px;
        background: radial-gradient(1200px 800px at 50% 30%, #1b1b1d, #0d0d0e 70%);
        color: #ededed;
        font:
          16px/1.5 -apple-system,
          BlinkMacSystemFont,
          "SF Pro Text",
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      video {
        width: min(1280px, 100%);
        aspect-ratio: 16 / 9;
        border-radius: 18px;
        background: #000;
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.08),
          0 50px 100px -40px #000;
      }
      h1 {
        font-size: clamp(28px, 4vw, 44px);
        letter-spacing: -0.03em;
        font-weight: 650;
        text-align: center;
      }
      p {
        color: #a3a3a3;
        text-align: center;
        max-width: 640px;
      }
      nav {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        justify-content: center;
      }
      a {
        color: inherit;
        text-decoration: none;
        border: 1px solid #333;
        border-radius: 12px;
        padding: 10px 18px;
        font-weight: 600;
      }
      a.primary {
        background: #ededed;
        color: #111;
        border-color: #ededed;
      }
      a:focus-visible {
        outline: 2px solid #a3a3a3;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <video src="video/gitmarks-intro.mp4" poster="video/poster.jpg" controls playsinline preload="metadata">
      <a href="video/gitmarks-intro.mp4">Download the gitmarks intro (MP4, 15 seconds)</a>
    </video>
    <h1>Private, categorised bookmarks in your own GitHub repo.</h1>
    <p>
      Save from the web, a browser extension, X, and the iPhone and Android share sheets. No database, no
      server to run. Every save is a commit.
    </p>
    <nav>
      <a class="primary" href="https://github.com/GeekyADAMS/gitmarks">View on GitHub</a>
      <a href="https://github.com/GeekyADAMS/gitmarks#setup">Set it up in five minutes</a>
    </nav>
  </body>
</html>
